site_name: Booksmart
site_description: Turn books into queryable knowledge, locally.
site_url: https://dworznik.github.io/booksmart/
repo_url: https://github.com/dworznik/booksmart
repo_name: dworznik/booksmart
edit_uri: edit/main/website/

# `website/` is published; `docs/` is internal (ADRs, PRDs, research, agent
# config) and is never part of the site. See CLAUDE.md.
docs_dir: website
site_dir: site

strict: true

theme:
  name: material
  # Template overrides. Only the landing page (website/index.md) selects one.
  custom_dir: overrides
  features:
    - content.code.copy
    - navigation.instant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  # The API reference under `website/api/` is generated by importing
  # booksmart-core and reading its docstrings and type hints. An identifier that
  # does not resolve is an error, and every warning (an unresolvable cross-ref
  # included) fails the build under `strict: true`, so a renamed symbol breaks CI
  # rather than publishing an empty page. Pages render whole modules (public
  # names only) instead of listing `members:`, because a misspelled entry in
  # such a list is dropped without a warning.
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [packages/core/src]
          options:
            docstring_style: google
            filters: ["!^_"]
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_if_no_docstring: true
            show_root_heading: true
            show_root_full_path: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# Swaps the marker in cli.md for a reference rendered from the Typer app.
hooks:
  - hooks/cli_reference.py

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - getting-started/installation.md
      - getting-started/quickstart.md
      - getting-started/configuration.md
  - CLI reference: cli.md
  - API reference:
      - api/index.md
      - Stages: api/stages.md
      - Runner: api/runner.md
      - Search: api/search.md
      - VectorStore: api/vectors.md
      - Storage: api/storage.md
